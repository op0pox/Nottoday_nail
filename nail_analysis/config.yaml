# ---------------------------------------------------------------------------
# 손가락 10개 순차 측정 순서
# ---------------------------------------------------------------------------
fingers:
  order:
    - R_thumb
    - R_index
    - R_middle
    - R_ring
    - R_pinky
    - L_thumb
    - L_index
    - L_middle
    - L_ring
    - L_pinky
  labels_ko:
    R_thumb: "오른손 엄지"
    R_index: "오른손 검지"
    R_middle: "오른손 중지"
    R_ring: "오른손 약지"
    R_pinky: "오른손 소지"
    L_thumb: "왼손 엄지"
    L_index: "왼손 검지"
    L_middle: "왼손 중지"
    L_ring: "왼손 약지"
    L_pinky: "왼손 소지"

# ---------------------------------------------------------------------------
# 출력/저장 경로
# ---------------------------------------------------------------------------
paths:
  data_dir: "data"
  captured_dir: "data/captured"
  results_dir: "data/results"
  debug_dir: "data/results/debug"
  collect_dir: "data/collect"
  calib_front_path: "data/results/calib_front.json"
  calib_side_path: "data/results/calib_side.json"
