# nail_analysis 설정 파일
# 모든 매직넘버/임계값/사이즈 테이블은 이 파일에서 관리한다.
# main.py는 --config로 다른 경로를 지정하지 않으면 이 파일을 기본으로 읽는다.

# ---------------------------------------------------------------------------
# 카메라 (Jetson Nano B01, CSI 포트 2개, IMX219)
# ---------------------------------------------------------------------------
camera:
  front:
    sensor_id: 0          # 정면(바닥, 손톱 위에서 내려다보는) 카메라
  side:
    sensor_id: 1           # 측면(손가락 옆, 수직으로 세운 ChArUco 보드와 같은 평면) 카메라
  capture_width: 1920
  capture_height: 1080
  preview_width: 1280      # 라이브 프리뷰는 720p 이하로 다운스케일 (Jetson Nano 성능 고려)
  preview_height: 720
  framerate: 21
  flip_method: 0           # 카메라가 뒤집혀 보이면 2(180도 회전) 등으로 조정

# ---------------------------------------------------------------------------
# ChArUco 보드 스펙 (정면/측면 동일 스펙 보드 1종을 공용으로 사용)
# ---------------------------------------------------------------------------
charuco_board:
  squares_x: 7
  squares_y: 5
  square_length_mm: 15.0
  marker_length_mm: 11.0    # square_length_mm의 약 0.73배 (비율 유지 권장)
  dictionary: DICT_4X4_50   # OpenCV cv2.aruco.DICT_4X4_50 이름

# ---------------------------------------------------------------------------
# 캘리브레이션 동작
# ---------------------------------------------------------------------------
calibration:
  # 측면 보드 평면과 손가락이 실제로 놓이는 평면 사이의 거리 차이(mm).
  # 보드를 손가락과 정확히 같은 평면에 세웠다면 0. 보드가 손가락보다
  # 카메라에서 더 멀리(또는 가까이) 있으면 그 거리 차이를 넣는다.
  # 스케일 보정 계수 = (board_distance_mm) / (board_distance_mm + side_plane_offset_mm)
  # (스케일 ∝ 1/거리 이므로, 손가락 평면이 보드보다 카메라에 더 가까우면
  #  실제 mm/px 스케일이 보드 기준보다 커야 한다 - calibration.py 참고)
  side_plane_offset_mm: 0.0
  min_markers_for_live_scale: 4     # 이 개수 미만으로 검출되면 실시간 스케일을 신뢰하지 않음
  reprojection_rms_warn_mm: 0.5
  # 실시간 검출 실패 시: 최근 성공한 스케일을 이 프레임 수만큼 유지 후,
  # 그래도 실패하면 저장된 calib_*.json의 스케일로 폴백
  scale_hold_frames: 30

# ---------------------------------------------------------------------------
# 손톱 검출 (고전 CV) 전처리 파라미터
# ---------------------------------------------------------------------------
detection:
  roi: null                    # [x, y, w, h] 고정 ROI. null이면 매 측정마다 마우스 드래그로 지정
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
  blur_kernel: [5, 5]
  use_adaptive_threshold: true # true: adaptiveThreshold, false: Canny 사용
  adaptive_block_size: 51      # 홀수만 가능
  adaptive_c: 5
  canny_low: 50
  canny_high: 150
  morph_kernel: [5, 5]
  morph_iterations: 2
  min_contour_area_ratio: 0.01 # ROI 면적 대비 이보다 작은 컨투어는 노이즈로 버림
  curvature_smoothing_window: 7   # 곡률 계산 전 컨투어 좌표 이동평균 스무딩 창 크기 (홀수)
  curvature_search_margin_ratio: 0.08  # 극값점(1,3,5,7) 근처는 곡률 탐색에서 제외하는 비율

side_view:
  tip_direction: right         # 측면 사진에서 손톱 끝이 향하는 방향 (left/right)
  tip_region_ratio: 0.35        # 실루엣 중 이 비율(끝쪽)만큼을 "끝 영역"으로 보고 점5/점10 탐색

# ---------------------------------------------------------------------------
# 바디 기장 분류: R = H_front / W_front
# ---------------------------------------------------------------------------
body_length:
  long_threshold: 1.5    # R >= 1.5 -> Long
  medium_threshold: 1.0  # 1.0 <= R < 1.5 -> Medium, R < 1.0 -> Short

# ---------------------------------------------------------------------------
# 유형 분류 (P/S/B/C) 임계값
# ---------------------------------------------------------------------------
nail_type:
  # 정면 사다리꼴 기울기 지표 s (0~5 스케일). s = clamp(diff_ratio * front_slope_scale, 0, 5)
  # diff_ratio = (윗변너비(점4-점6) - 아랫변너비(점2-점8)) / 아랫변너비
  front_slope_scale: 5.0
  front_slope_pc_max: 1.0     # s < 1.0 -> P/C 후보 (평행에 가까움)
  front_slope_sb_min: 1.0     # s >= 1.0 -> S/B 후보 (부채꼴)

  # 측면 판정 트리 1단계: 점3-점4 높이 비교
  side_height_tolerance_mm: 0.3   # 이 값 이하 차이면 "같은 높이"로 간주 -> S/C 분기, 아니면 P/B 분기

  # 측면 판정 트리 2단계 (S/C 분기): 최대너비 폭 + 안쪽(큐티클 쪽) 깊이로 판단
  # depth_ratio: 점3/점9 위치가 (점1=0)~(점5=1) 축에서 어디쯤인지. 작을수록 큐티클에 더 가까움(안쪽/깊음)
  side_c_depth_ratio_max: 0.5      # depth_ratio가 이 값 이하(큐티클 쪽으로 깊음)면 C 후보
  side_c_width_threshold_mm: 4.0   # W_side가 이 값 이상이면 "충분히 넓음" -> (깊이 조건과 함께) C, 아니면 S

  # 측면 판정 트리 3단계 (P/B 분기): 손톱끝(5) vs 살끝(10) 높이 비교
  side_tip_tolerance_mm: 0.2      # 점5-점10 높이차가 이 값 이하면 "같음"으로 간주 -> B 쪽으로 처리
  # 원본 PDF 문구가 애매해서(점5/점10 상대적 높이 표현이 두 문장에서 서로 엇갈림) 기본 해석은
  # "점5(손톱끝)가 점10(살끝)보다 명확히 높으면(더 위로 튀어나오면) P, 그렇지 않으면(같거나 낮으면) B"
  # 로 구현했다. 실측 검증 후 반대로 나오면 이 값을 true로 바꿔서 방향을 뒤집을 수 있다.
  side_pb_invert: false

# ---------------------------------------------------------------------------
# 곡면 길이 공식 상수 (유형별). 6절 공식 참고.
# flat = W_front * flat_ratio, h = c * h_ratio
# PDF 원문(P=2L+1/2 a, S/C=2L+1/3 a, B=2L+2/3 a)과 동치임을
# tests/test_curve.py에서 검증한다.
# ---------------------------------------------------------------------------
curve_constants:
  P:
    flat_ratio: 0.2          # 1/5
    h_ratio: 0.25             # 1/4
  S:
    flat_ratio: 0.142857143  # 1/7
    h_ratio: 0.142857143      # 1/7
  B:
    flat_ratio: 0.25          # 1/4 (=2/8)
    h_ratio: 0.166666667      # 1/6
  C:
    flat_ratio: 0.142857143  # 1/7
    h_ratio: 0.2               # 1/5

# ---------------------------------------------------------------------------
# 팁 사이즈 테이블 (전개도 최대너비 mm). 실제 값 확정 전이므로 placeholder.
# 이 테이블만 교체하면 매칭 결과가 실제 제품 사이즈에 맞게 바뀐다.
# ---------------------------------------------------------------------------
