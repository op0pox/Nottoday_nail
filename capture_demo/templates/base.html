<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}손톱 측정{% endblock %}</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: #f5f5f7; color: #1d1d1f;
  }
  .card {
    max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px;
    padding: 24px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 16px; color: #555; font-weight: 500; }
  p.desc { color: #666; font-size: 0.92rem; line-height: 1.5; }
  .progress { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: 0.9rem; }
  input[type=file] { width: 100%; padding: 10px 0; }
  select, input[type=radio] { font-size: 1rem; }
  .radio-row { display: flex; gap: 20px; margin-top: 6px; }
  .radio-row label { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
  button, .btn {
    width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 10px;
    background: #2f6fed; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    text-align: center; text-decoration: none; display: block;
  }
  button:active, .btn:active { background: #1d4fc4; }
  .error {
    background: #fdecec; color: #c0392b; padding: 10px 14px; border-radius: 8px;
    font-size: 0.88rem; margin-top: 14px; white-space: pre-wrap;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.88rem; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #eee; }
  th:first-child, td:first-child { text-align: left; }
  .muted { color: #999; font-size: 0.8rem; margin-top: 24px; }
</style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
