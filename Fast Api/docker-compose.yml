version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: server
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
      - ./models:/app/models:ro
    restart: none

  front:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.front
    container_name: front
    ports:
      - "5173:5173"
    environment:
      VITE_JETSON_URL: ${VITE_JETSON_URL}
    volumes:
      - ./front:/app/front
      - /app/front/node_modules
    restart: none