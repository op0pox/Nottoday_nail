version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: server
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
      - ./nail_shape:/app/nail_shape
      - ${MODEL_DIR}:/app/model.pt:ro # env에 적혀있는 모델파일을 읽기전용으로 연결
    environment:
      MODEL_DIR: /app/model.pt # 위 모델볼륨의 위치
    restart: none

  front:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.front
    container_name: front
    environment:
      VITE_JETSON_URL: ${VITE_JETSON_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app/front
      - /app/front/node_modules
    restart: none