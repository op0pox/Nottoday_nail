version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: server
    env_file:
      - .env
    environment:
      UTILS_DIR: /app/utils
      # Windows 폴더를 붙이면 파일 변경 알림이 안 와서 코드를 고쳐도 서버가 안 바뀐다. 주기적으로 확인한다.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
      - ./models:/app/models:ro
      # Jetson 사진 저장 (utils/jetson_capture, utils/data/dataset_jetson.csv)
      - ../utils:/app/utils
    restart: none

  front:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.front
    container_name: front
    ports:
      - "5173:5173"
    environment:
      VITE_JETSON_URL: ${VITE_JETSON_URL}
      # 위와 같은 이유로 프론트도 파일 변경을 주기적으로 확인한다 (vite.config.ts).
      VITE_USE_POLLING: "true"
    volumes:
      - ./front:/app/front
      - /app/front/node_modules
    restart: none